; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html
;
;   pio run -e tx -t upload   -> placa emisora  (DHT11 -> LoRa)
;   pio run -e rx -t upload   -> placa receptora (LoRa -> MQTT)
;   pio run -e power_tx -t upload   -> experiment power_tx (TX, RX uses env rx)
;   pio run -e range_speed_bw_tx -t upload   -> experiment range-speed-balance-bw (TX)
;   pio run -e range_speed_bw_rx -t upload   -> experiment range-speed-balance-bw (RX)

[env]
platform = espressif32
board = heltec_wifi_lora_32_V2
framework = arduino
monitor_speed = 115200
build_flags = -I include

lib_deps =
    knolleary/PubSubClient @ ^2.8
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.9
    bblanchon/ArduinoJson @ ^6.21.5
    sandeepmistry/LoRa@^0.8.0

; experiment firmwares live in test/ but are not unit tests
test_ignore = range_speed_balance_bw, power_tx

[env:tx]
build_src_filter = +<tx/>
monitor_filters = log2file, time


[env:rx]
build_src_filter = +<rx/>
monitor_filters = log2file, time


; Experiment: changing transmission power (energy consumption and signal strength)
[env:power_tx]
build_src_filter = +<../test/power_tx/>
monitor_filters = log2file, time

; Experiment: adjusting bandwidth and data rate to balance speed and range
[env:range_speed_bw_tx]
build_src_filter = +<../test/range_speed_balance_bw/>
monitor_filters = log2file, time
build_flags =
    -I include
    -D MODE=1

[env:range_speed_bw_rx]
build_src_filter = +<../test/range_speed_balance_bw/>
monitor_filters = log2file, time
build_flags =
    -I include
    -D MODE=0
